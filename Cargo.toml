[package]
name = "Intern"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
const_format = "0.2.36"
env_logger = "0.11.11"
futures = "0.3.34"
iced = { version = "0.14.0", features = ["tokio"] }
log = "0.4.34"
serde = "1.0.229"
thirtyfour = "0.37.5"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
toml = "1.1.6"
diesel = { version = "2.2.0", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
rfd = "0.17.2"
regex = "1.13.1"
chrono = "0.4.45"
rxrust = "1.0.0-rc.0"
iced_aw = { version = "0.14.1", features = ["card", "menu", "tabs", "tab_bar", "number_input", "spinner", "badge", "typed_input"] }
multimap = "0.10.1"
